<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theirs Email Design System Previewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #e4e4e7;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    aside {
      width: 340px;
      background: #14171d;
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .header {
      padding: 20px 24px;
      border-bottom: 1px solid #27272a;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo span { color: #df702b; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(223, 112, 43, 0.15);
      color: #df702b;
      margin-top: 6px;
    }
    .nav {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: #a1a1aa;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .nav-item:hover {
      background: #1e222b;
      color: #ffffff;
    }
    .nav-item.active {
      background: rgba(223, 112, 43, 0.12);
      border-color: rgba(223, 112, 43, 0.3);
      color: #ffffff;
    }
    .nav-cat {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #df702b;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .nav-title {
      font-size: 13.5px;
      font-weight: 500;
      color: #f4f4f5;
    }
    .nav-subject {
      font-size: 12px;
      color: #71717a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090a0d;
      overflow: hidden;
    }
    .topbar {
      padding: 14px 24px;
      background: #14171d;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .current-info h2 {
      font-size: 15px;
      font-weight: 600;
      color: #f4f4f5;
    }
    .current-info p {
      font-size: 12px;
      color: #71717a;
      margin-top: 2px;
    }
    .view-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-toggle {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-toggle.active {
      background: #df702b;
      border-color: #df702b;
      color: #fff;
    }
    .open-link {
      font-size: 12px;
      color: #df702b;
      text-decoration: none;
      font-weight: 500;
      margin-left: 8px;
    }
    .open-link:hover { text-decoration: underline; }
    .frame-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      overflow-y: auto;
      background: #181b22;
    }
    iframe {
      width: 100%;
      max-width: 680px;
      height: 860px;
      border: 1px solid #27272a;
      border-radius: 12px;
      background: #fafaf9;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transition: max-width 0.25s ease;
    }
    iframe.mobile {
      max-width: 390px;
      height: 740px;
      border-radius: 36px;
      border: 6px solid #27272a;
    }
  </style>
</head>
<body>
  <aside>
    <div class="header">
      <div class="logo">theirs<span>.page</span></div>
      <div class="badge">Modernized Email Design</div>
    </div>
    <div class="nav" id="navList"></div>
  </aside>
  <main>
    <div class="topbar">
      <div class="current-info">
        <h2 id="activeTitle">Loading...</h2>
        <p id="activeSubject"></p>
      </div>
      <div class="view-controls">
        <button class="btn-toggle active" id="btnDesktop" onclick="setViewMode('desktop')">Desktop</button>
        <button class="btn-toggle" id="btnMobile" onclick="setViewMode('mobile')">Mobile (390px)</button>
        <a id="btnNewTab" href="#" target="_blank" class="open-link">Open in new tab ↗</a>
      </div>
    </div>
    <div class="frame-container">
      <iframe id="previewFrame" src="01-welcome.html"></iframe>
    </div>
  </main>

  <script>
    const emailList = [{"filename":"01-welcome.html","title":"01. Welcome to Theirs","category":"Lifecycle / Onboarding","subject":"Welcome to Theirs"},{"filename":"02-memorial-created.html","title":"02. Memorial Draft Created","category":"Lifecycle / Creation","subject":"Your draft for Arthur Pendelton is ready"},{"filename":"03-memorial-published.html","title":"03. Memorial Published (Live)","category":"Lifecycle / Publishing","subject":"Arthur Pendelton’s memorial is now live"},{"filename":"04-memorial-deleted.html","title":"04. Memorial Deletion Confirmation","category":"Lifecycle / Account","subject":"Memorial deletion confirmation"},{"filename":"05-trustpilot-invite.html","title":"05. Feedback & Review Invitation","category":"Customer Experience","subject":"How has Theirs been for your family?"},{"filename":"06-trustpilot-reminder.html","title":"06. Review Reminder (Follow-Up)","category":"Customer Experience","subject":"How has Theirs been for your family?"},{"filename":"07-collaborator-invitation.html","title":"07. Collaborator / Family Invitation","category":"Collaboration","subject":"Invitation to care for Arthur Pendelton's memorial"},{"filename":"08-guest-contribution.html","title":"08. Guest Contribution / Memory Received","category":"Moderation Notification","subject":"Michael Jenkins shared a remembrance of Arthur Pendelton"},{"filename":"09-private-caretaker-message.html","title":"09. Private Message From Visitor","category":"Caretaker Inbox","subject":"Emily Watson sent a private message about Arthur Pendelton"},{"filename":"10-support-inquiry.html","title":"10. Support Request Notification","category":"Platform Support","subject":"[Support - billing] Question regarding memorial archive export"}];

    let activeIndex = 0;

    function renderNav() {
      const container = document.getElementById('navList');
      container.innerHTML = emailList.map((item, idx) => `
        <button class="nav-item ${idx === activeIndex ? 'active' : ''}" onclick="selectEmail(${idx})">
          <div class="nav-cat">${item.category}</div>
          <div class="nav-title">${item.title}</div>
          <div class="nav-subject">${item.subject}</div>
        </button>
      `).join('');
    }

    function selectEmail(idx) {
      activeIndex = idx;
      const item = emailList[idx];
      document.getElementById('activeTitle').innerText = item.title;
      document.getElementById('activeSubject').innerText = 'Subject: ' + item.subject;
      document.getElementById('previewFrame').src = item.filename;
      document.getElementById('btnNewTab').href = item.filename;
      renderNav();
    }

    function setViewMode(mode) {
      const frame = document.getElementById('previewFrame');
      const btnDesk = document.getElementById('btnDesktop');
      const btnMob = document.getElementById('btnMobile');

      if (mode === 'mobile') {
        frame.classList.add('mobile');
        btnMob.classList.add('active');
        btnDesk.classList.remove('active');
      } else {
        frame.classList.remove('mobile');
        btnDesk.classList.add('active');
        btnMob.classList.remove('active');
      }
    }

    selectEmail(0);
  </script>
</body>
</html>
